{{define "base"}}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.PageTitle}} · Gravel Montpellier</title>
  <link rel="stylesheet" href="{{.Root}}static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{.Root}}index.html">
        <span class="brand-mark">⛰</span>
        <span>Gravel Montpellier</span>
      </a>
      <nav>
        <a href="{{.Root}}index.html">Sorties</a>
      </nav>
    </div>
  </header>

  <main>
    {{template "content" .}}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      {{.Footer}}
    </div>
  </footer>

  <script src="{{.Root}}static/script.js"></script>
</body>
</html>
{{end}}
