name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests (Go + script Python des pentes)
        run: |
          go vet ./...
          go test ./...
          python3 -m unittest discover -s tools -p "test_*.py"

      # Recalcule les traces colorisées selon la pente (bibliothèque standard
      # Python, aucune installation) : le site publié reste juste même si
      # rides/*/slope.geojson n'a pas été régénéré après un changement de GPX.
      - name: Coloriser les traces selon la pente
        run: python3 tools/slope_colors.py

      # Visuel Instagram (instagram.jpg) des sorties qui n'en ont pas encore :
      # publié avec le site (bouton « Instagram » de la fiche), pas commité.
      # Les sorties qui ont déjà le leur dans le dépôt le gardent. Un échec
      # (réseau, sortie incomplète) ne bloque pas le déploiement.
      - name: Visuels Instagram manquants
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://montpellier.cycloexplore.fr' }}
        run: |
          pip install -r tools/requirements.txt
          python3 tools/make_instagram_image.py --manquantes --site-url "$SITE_URL"

      - name: Générer le site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://montpellier.cycloexplore.fr' }}
          UMAMI_ID: ${{ vars.UMAMI_ID || '9e97164b-65cd-4fef-82f2-f08b105783d3' }}
          COMMIT_SHA: ${{ github.sha }}
        run: go run ./cmd/generator -rides ./rides -footer ./content/footer.md -legal ./content/mentions-legales.md -site-url "$SITE_URL" -umami-id "$UMAMI_ID" -version "${COMMIT_SHA:0:7}" -out ./public

      - name: Uploader l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
